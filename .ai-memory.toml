# Projeto fixado de proposito. Sem esta linha, o hook derivaria o nome do
# basename do repositorio git — e qualquer repo aninhado (ou clonado aqui
# dentro) viraria um projeto novo no servidor.
workspace = "default"
project = "FIAP"

[capture]
ignore_paths = [
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  "*.key",
  "**/*.key",
  "*.pem",
  "**/*.pem",
  "secrets/**",
  "**/secrets/**",
  "credentials*",
  "**/credentials*",

  # Wallet Oracle do MEDFLOW. O cwallet.sso e auto-login: quem tem o arquivo
  # entra no banco sem senha, e o sanitizador de 18 regex nao reconhece blob
  # binario de wallet. O .gitignore protege o repositorio; estas linhas
  # protegem a memoria.
  "wallets/**",
  "**/wallets/**",
  "*.sso",
  "**/*.sso",
  "*.p12",
  "**/*.p12",
  "*.jks",
  "**/*.jks",
  "tnsnames.ora",
  "**/tnsnames.ora",
  "Motor_Forecast*",
  "**/Motor_Forecast*",
  "*x29*",
  "**/*x29*",
  "*do_aaa*",
  "**/*do_aaa*",

  # Artefatos da Fase 4 com credencial Redis embutida.
  # O .gitignore protege o repositorio; estas linhas protegem a memoria.
  # Ver 01_pbl_cidade_alfa/entregues/fase_4/SEGURANCA.md
  "*gera_mapa_html*",
  "**/*gera_mapa_html*",
  "Omega_Urban_Tech_PBL_Fase_4.zip",
  "**/Omega_Urban_Tech_PBL_Fase_4.zip",
]
