name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline — lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o pacote em modo editável
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      # A checagem de conteúdo (`make fixtures-conferir`) precisa do Oracle e
      # não roda aqui de propósito: um push não deve ficar vermelho porque o
      # Always Free hibernou.
      #
      # Este passo confere só o carimbo, e num runner limpo não há Gold com que
      # comparar — o script detecta isso e sai sem erro. Até 11/08/2026 ele
      # levantava FileNotFoundError, o que tornava o passo impossível de passar
      # aqui: um portão que nunca fecha não é portão.
      - name: Snapshots do webapp batem com o carimbo da Gold
        run: python scripts/reancorar_fixtures.py --conferir

  web:
    name: Frontend — build e Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # 30 dos 32 testes interceptam as rotas e nunca chegam ao proxy. Os
      # outros 2 são integração ao vivo contra o Oracle, marcados @live e
      # excluídos aqui: um push não deve ficar vermelho porque o Always Free
      # hibernou. O valor de fachada mantém o guard do vite.config válido
      # para quem roda `npm run dev` de verdade.
      ORDS_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck e build
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright — suíte hermética
        run: npx playwright test --grep-invert @live

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
