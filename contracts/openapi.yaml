              id: { type: string }
              label: { type: string }
              left_label: { type: string }
              left_value: { type: integer }
              right_label: { type: string }
              right_value: { type: integer }
              difference: { type: integer }
              status: { type: string }
              note: { type: string }
        definitions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              definition: { type: string }
              gold_field: { type: string }
              value_status: { type: string }
              value_note: { type: string }
        states:
